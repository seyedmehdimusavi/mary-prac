<div class="essay-container">
  <div class="header">
    <h1>{{ getTemplateTitle() }}</h1>
    
    <div class="template-selector">
      <label>
        <input type="radio" name="templateType" value="essay1" [checked]="selectedTemplate === 'essay1'" (change)="changeTemplate('essay1')">
        <span>Essay 1</span>
      </label>
      <label>
        <input type="radio" name="templateType" value="essay2" [checked]="selectedTemplate === 'essay2'" (change)="changeTemplate('essay2')">
        <span>Essay 2</span>
      </label>
      <label>
        <input type="radio" name="templateType" value="essay3" [checked]="selectedTemplate === 'essay3'" (change)="changeTemplate('essay3')">
        <span>Essay 3</span>
      </label>
      <label>
        <input type="radio" name="templateType" value="essay4" [checked]="selectedTemplate === 'essay4'" (change)="changeTemplate('essay4')">
        <span>Essay 4</span>
      </label>
      <label>
        <input type="radio" name="templateType" value="essay5" [checked]="selectedTemplate === 'essay5'" (change)="changeTemplate('essay5')">
        <span>Essay 5</span>
      </label>
      <label>
        <input type="radio" name="templateType" value="essay6" [checked]="selectedTemplate === 'essay6'" (change)="changeTemplate('essay6')">
        <span>Essay 6</span>
      </label>
      <label>
        <input type="radio" name="templateType" value="swt" [checked]="selectedTemplate === 'swt'" (change)="changeTemplate('swt')">
        <span>SWT</span>
      </label>
      <label>
        <input type="radio" name="templateType" value="sst" [checked]="selectedTemplate === 'sst'" (change)="changeTemplate('sst')">
        <span>SST</span>
      </label>
      <label>
        <input type="radio" name="templateType" value="di" [checked]="selectedTemplate === 'di'" (change)="changeTemplate('di')">
        <span>DI</span>
      </label>
      <label>
        <input type="radio" name="templateType" value="di2" [checked]="selectedTemplate === 'di2'" (change)="changeTemplate('di2')">
        <span>DI 2</span>
      </label>
      <label>
        <input type="radio" name="templateType" value="sGD" [checked]="selectedTemplate === 'sGD'" (change)="changeTemplate('sGD')">
        <span>SGD</span>
      </label>
      <label>
        <input type="radio" name="templateType" value="rTS" [checked]="selectedTemplate === 'rTS'" (change)="changeTemplate('rTS')">
        <span>RTS</span>
      </label>
      <label>
        <input type="radio" name="templateType" value="retell_lecture" [checked]="selectedTemplate === 'retell_lecture'" (change)="changeTemplate('retell_lecture')">
        <span>Retell Lecture</span>
      </label>
    </div>
  </div>

  <div class="template-container">
    <h2>Template to Memorize: <span class="template-description">{{ getTemplateDescription() }}</span></h2>
    <div class="template-text">
      {{ template }}
    </div>
  </div>

  <div class="translation-container">
    <h2>Translation (ترجمه):</h2>
    <div class="translation-text">
      {{ templateTranslation }}
    </div>
  </div>

  <div class="two-column-layout">
    <div class="column input-container">
      <h2>Practice Area:</h2>
      <textarea 
        [(ngModel)]="userInput" 
        (input)="checkInput()" 
        placeholder="Start typing the template here..."
        rows="10"
      ></textarea>
    </div>

    <div class="column result-container">
      <h2>Your Progress:</h2>
      <div class="result-text" *ngIf="userInput">
        <span *ngFor="let word of userInput.split(' '); let i = index" [class]="getWordClass(i)">
          {{ word }} 
        </span>
      </div>
      <div class="empty-state" *ngIf="!userInput">
        <p>Start typing to see your progress here</p>
      </div>
    </div>
  </div>

  <div class="progress-container">
    <div class="progress-bar" [style.width.%]="getProgress()"></div>
    <span class="progress-text">{{ getProgress() }}% Complete</span>
  </div>
  
  <div class="actions">
    <button (click)="resetExercise()">Reset</button>
  </div>
</div>
